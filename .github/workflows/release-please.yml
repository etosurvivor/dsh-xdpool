## 发布 PR 不自动合并。先在本机 desktop profile 安装候选包、重启并验证，
## 然后由维护者按 README 流程合并或发布；禁止跳过本机验收。
name: Release Please

on:
  push:
    branches: [main]
  # 手动补跑：链路中途断了，可以点一下重放，不用等下一次 push
  workflow_dispatch:

## release-please 要改 package.json / CHANGELOG、开 PR、打 tag、建 Release
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.AUTOMERGE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
